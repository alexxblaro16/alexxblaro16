<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Alejandro Blanco Rodríguez · Desarrollador Full Stack Junior">
  <defs>
    <style>
      .m { font-family: "JetBrains Mono", "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace; font-size: 21px; }
      .k { fill: #c678dd; } .t { fill: #e5c07b; } .s { fill: #98c379; } .c { fill: #7f848e; font-style: italic; }
      .p { fill: #abb2bf; } .n { fill: #61afef; } .v { fill: #e06c75; } .l { fill: #4b5263; }

      /* Ciclo de 12 s que se repite siempre: se escribe línea a línea, se queda unos segundos y se borra.
         En cada línea, el tramo en el que se escribe usa steps(n) para que avance letra a letra. */
      .l1, .l2, .l3, .l4, .l6 { clip-path: inset(0 100% 0 0); animation: 12s infinite; }
      .l1 { animation-name: e1; } .l2 { animation-name: e2; } .l3 { animation-name: e3; }
      .l4 { animation-name: e4; } .l6 { animation-name: e6; }
      @keyframes e1 { 0%, 2.5% { clip-path: inset(0 100% 0 0); animation-timing-function: steps(33); }
                      8.3%, 90% { clip-path: inset(0 0 0 0); animation-timing-function: ease-in; } 95%, 100% { clip-path: inset(0 100% 0 0); } }
      @keyframes e2 { 0%, 9.2% { clip-path: inset(0 100% 0 0); animation-timing-function: steps(44); }
                      16.7%, 90% { clip-path: inset(0 0 0 0); animation-timing-function: ease-in; } 95%, 100% { clip-path: inset(0 100% 0 0); } }
      @keyframes e3 { 0%, 17.5% { clip-path: inset(0 100% 0 0); animation-timing-function: steps(51); }
                      25.8%, 90% { clip-path: inset(0 0 0 0); animation-timing-function: ease-in; } 95%, 100% { clip-path: inset(0 100% 0 0); } }
      @keyframes e4 { 0%, 26.7% { clip-path: inset(0 100% 0 0); animation-timing-function: steps(45); }
                      34.2%, 90% { clip-path: inset(0 0 0 0); animation-timing-function: ease-in; } 95%, 100% { clip-path: inset(0 100% 0 0); } }
      @keyframes e6 { 0%, 35% { clip-path: inset(0 100% 0 0); animation-timing-function: steps(78); }
                      47.5%, 90% { clip-path: inset(0 0 0 0); animation-timing-function: ease-in; } 95%, 100% { clip-path: inset(0 100% 0 0); } }

      /* La llave final, el cursor y el comentario aparecen al terminar y se van con el borrado */
      .fin { opacity: 0; animation: verFin 12s infinite; }
      @keyframes verFin { 0%, 48% { opacity: 0; } 48.5%, 90% { opacity: 1; } 93%, 100% { opacity: 0; } }
      .comentario { opacity: 0; animation: verComentario 12s infinite; }
      @keyframes verComentario { 0%, 50% { opacity: 0; } 56%, 89% { opacity: 1; } 93%, 100% { opacity: 0; } }
      .parpadeo { animation: parpadeo 1.1s steps(1) infinite; }
      @keyframes parpadeo { 50% { opacity: 0; } }
    </style>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f27"/><stop offset="1" stop-color="#232a35"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" rx="16" fill="url(#g)"/>
  <!-- barra de la ventana -->
  <rect width="1200" height="46" rx="16" fill="#151920"/>
  <rect y="30" width="1200" height="16" fill="#151920"/>
  <circle cx="30" cy="23" r="7" fill="#ff5f57"/><circle cx="54" cy="23" r="7" fill="#febc2e"/><circle cx="78" cy="23" r="7" fill="#28c840"/>
  <rect x="110" y="10" width="186" height="36" rx="7" fill="#1b1f27"/>
  <text x="128" y="34" class="m p" style="font-size:16px">☕ HelloWorld.java</text>
  <!-- código -->
  <g class="m">
    <text x="28" y="96" class="l">1</text>
    <text x="70" y="96" class="l1"><tspan class="k">public class</tspan><tspan class="t"> AlejandroBlanco</tspan><tspan class="p"> {</tspan></text>
    <text x="28" y="132" class="l">2</text>
    <text x="121" y="132" class="l2"><tspan class="t">String</tspan><tspan class="v"> rol</tspan><tspan class="p"> = </tspan><tspan class="s">"Desarrollador Full Stack Junior"</tspan><tspan class="p">;</tspan></text>
    <text x="28" y="168" class="l">3</text>
    <text x="121" y="168" class="l3"><tspan class="t">String</tspan><tspan class="p">[] </tspan><tspan class="v">stack</tspan><tspan class="p"> = { </tspan><tspan class="s">"Java"</tspan><tspan class="p">, </tspan><tspan class="s">"React"</tspan><tspan class="p">, </tspan><tspan class="s">"Laravel"</tspan><tspan class="p">, </tspan><tspan class="s">"Python"</tspan><tspan class="p"> };</tspan></text>
    <text x="28" y="204" class="l">4</text>
    <text x="121" y="204" class="l4"><tspan class="t">String</tspan><tspan class="v"> base</tspan><tspan class="p"> = </tspan><tspan class="s">"Madrid · UDIT · 3.º Full Stack"</tspan><tspan class="p">;</tspan></text>
    <text x="28" y="240" class="l">5</text>
    <text x="28" y="276" class="l">6</text>
    <text x="121" y="276" class="l6"><tspan class="k">public static void</tspan><tspan class="n"> main</tspan><tspan class="p">(</tspan><tspan class="t">String</tspan><tspan class="p">[] args) { </tspan><tspan class="t">System</tspan><tspan class="p">.out.</tspan><tspan class="n">println</tspan><tspan class="p">(</tspan><tspan class="s">"Hello, World!"</tspan><tspan class="p">); }</tspan></text>
    <text x="28" y="312" class="l">7</text>
    <g class="fin">
      <text x="70" y="312" class="p">}</text>
      <rect x="86" y="294" width="11" height="23" fill="#2fbf71" class="parpadeo"/>
    </g>
    <text x="1172" y="312" class="c comentario" text-anchor="end" style="font-size:16px">// donde empezó todo</text>
  </g>
</svg>
