# Genera cada día la serpiente que se come las contribuciones del perfil
# y la publica en la rama "output" para que el README la enseñe
name: Serpiente de contribuciones

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/serpiente.svg?color_snake=#2fbf71
            dist/serpiente-oscura.svg?palette=github-dark&color_snake=#2fbf71

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
